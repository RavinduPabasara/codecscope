name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The offline suite needs no model weights and no network, so it runs on
    # every supported interpreter in about a second each. The integration
    # marker is excluded by pytest.ini's addopts.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest

  quality:
    # Optional extras live here rather than in the matrix: they pull scipy and
    # a compiled PESQ wheel, which are not worth building five times over.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with quality and audio extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality,audio]"
      - name: Test including STOI, PESQ, and soundfile paths
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Black
        run: black --check --line-length 88 codecscope tests
      - name: Flake8
        run: flake8 --max-line-length 100 codecscope tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
